name: Release

# Builds the Windows installer and portable exe, and publishes them to GitHub Releases.
# Runs when a version tag is pushed, e.g. `git tag v0.2.0 && git push origin v0.2.0`.
# The tag must match the version in package.json.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        shell: bash
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version. Push $want instead."
            exit 1
          fi
      - run: npm ci
      - run: npm test
      # The installer and the portable exe upload at the same time. If no release exists yet,
      # each one creates its own and the tag ends up with two. So make one draft release
      # first, let both uploads go into it, then publish it.
      - name: Create the draft release
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --draft --title "${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the release
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
